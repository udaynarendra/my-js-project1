<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Language Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>JavaScript Language Translator</h2>

        <div class="user-input">
            <label for="input-text">Text to translate</label>
            <input
                id="input-text"
                class="input"
                type="text"
                name="text"
                placeholder="Enter text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                required
                aria-required="true"
            >
            <br>
            <label for="source-language">From:</label>
            <select id="source-language" class="changed js-From" name="source-language" aria-label="Source language">
                <option value="" disabled selected>Select language</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
            </select>
            <br>
            <label for="target-language">To:</label>
            <select id="target-language" class="changed js-To" name="target-language" aria-label="Target language">
                <option value="" disabled selected>Select language</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
            </select>
        </div>
        <button type="button" class="btn js-btn">Translate</button>
        <p class="status js-status" role="status" aria-live="polite"></p>
        <div class="output" aria-live="polite"></div>
    </div>
    <script src="translator.js"></script>
</body>
</html>
