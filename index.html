<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple browser-based language translator for English, Telugu, and Hindi.">
    <title>JavaScript Language Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Language Translator</h1>

        <div class="user-input">
            <label for="input-text">Text to translate</label>
            <input id="input-text" class="input" type="text" placeholder="Enter text" autocomplete="off">

            <label for="source-language">From</label>
            <select id="source-language" class="changed js-From">
                <option value="" selected disabled>Select language</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
            </select>

            <label for="target-language">To</label>
            <select id="target-language" class="changed js-To">
                <option value="" selected disabled>Select language</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
            </select>
        </div>

        <button class="btn js-btn" type="button">Translate</button>
        <p class="status" aria-live="polite"></p>
        <div class="output" aria-live="polite"></div>
    </main>
    <script src="translator.js"></script>
</body>
</html>
