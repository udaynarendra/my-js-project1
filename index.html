<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container" aria-labelledby="app-title">
        <h1 id="app-title">Language Translator</h1>

        <section class="user-input" aria-label="Translation controls">
            <label for="input-text">Text to translate</label>
            <input id="input-text" class="input" type="text" placeholder="Enter text">

            <label for="source-language">From</label>
            <select id="source-language" class="changed js-source-language">
                <option value="" disabled selected>Select language</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
            </select>

            <label for="target-language">To</label>
            <select id="target-language" class="changed js-target-language">
                <option value="" disabled selected>Select language</option>
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
            </select>
        </section>

        <button type="button" class="btn js-translate-btn">Translate</button>
        <div id="translation-output" class="output" aria-live="polite" role="status"></div>
    </main>
    <script src="translator.js"></script>
</body>
</html>
